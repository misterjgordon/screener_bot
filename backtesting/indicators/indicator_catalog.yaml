# Single source of truth for bar-table indicators (see INDICATOR_PIPELINE_PLAN.md).
# default_pipeline_ids: ids run when IndicatorPipeline() is constructed without explicit ids
# series_fn: module:callable in strategies/indicators/
# inputs: kwarg name -> column on frame.bars (or daily column name on frame.daily_bars)
# params: passed to series_fn after inputs
# requires: indicator ids that must run first
# daily_inputs: kwarg -> column on frame.daily_bars
# bar_interval_minutes: frame interval this entry expects

default_pipeline_ids:
  - trading_date
  - session
  - ema9
  - ema21
  - ema50
  - vwap
  - rvol
  - rvol_time
  - adr
  - atr

indicators:
  - id: trading_date
    kind: indicator
    description: Exchange session calendar date (America/New_York) from UTC timestamp
    version: '1'
    series_fn: strategies.indicators.trading_date:trading_date_series_utc
    inputs:
      timestamp_utc: timestamp
    params: {}
    outputs:
      - trading_date
    requires: []
    bar_interval_minutes: 1

  - id: session
    kind: session_column
    description: Exchange session label (PM/RTH/AH) from UTC timestamp
    version: '1'
    series_fn: strategies.indicators.session:session_series
    inputs:
      timestamp_utc: timestamp
    params:
      timezone: 'America/New_York'
    outputs:
      - session
    requires: []
    bar_interval_minutes: 1

  - id: ema9
    kind: indicator
    description: 9-period EMA of close
    version: '1'
    series_fn: strategies.indicators.ema:ema_series
    inputs:
      close: close
    params:
      period: 9
    outputs:
      - ema9
    requires: []
    bar_interval_minutes: 1

  - id: ema21
    kind: indicator
    description: 21-period EMA of close
    version: '1'
    series_fn: strategies.indicators.ema:ema_series
    inputs:
      close: close
    params:
      period: 21
    outputs:
      - ema21
    requires: []
    bar_interval_minutes: 1

  - id: ema50
    kind: indicator
    description: 50-period EMA of close
    version: '1'
    series_fn: strategies.indicators.ema:ema_series
    inputs:
      close: close
    params:
      period: 50
    outputs:
      - ema50
    requires: []
    bar_interval_minutes: 1

  - id: vwap
    kind: indicator
    description: Cumulative VWAP from first bar of trading_date (hlc3 typical price)
    version: '1'
    series_fn: strategies.indicators.vwap:vwap_series
    inputs:
      high: high
      low: low
      close: close
      volume: volume
      trading_date: trading_date
    params: {}
    outputs:
      - vwap
    requires:
      - trading_date
    bar_interval_minutes: 1

  - id: cumulative_avg_volume
    kind: indicator
    description: >
      Mean cumulative volume at this ET bar time over the prior period session days (RVOL
      denominator). PM, RTH, and AH included.
    version: '1'
    series_fn: strategies.indicators.cumulative_avg_volume:cumulative_avg_volume_series
    inputs:
      trading_date: trading_date
      volume: volume
      timestamp_utc: timestamp
    params:
      period: 10
    outputs:
      - cumulative_avg_volume
    requires:
      - trading_date
    requires_history_bars: true
    bar_interval_minutes: 1

  - id: rvol
    kind: indicator
    description: >
      Cumulative volume so far on trading_date / cumulative_avg_volume at this bar. PM, RTH,
      and AH included.
    version: '1'
    series_fn: strategies.indicators.rvol:rvol_series
    inputs:
      trading_date: trading_date
      volume: volume
      timestamp_utc: timestamp
      cumulative_avg_volume: cumulative_avg_volume
    params: {}
    outputs:
      - rvol
    requires:
      - trading_date
      - cumulative_avg_volume
    requires_history_bars: true
    bar_interval_minutes: 1

  - id: rvol_time
    kind: indicator
    description: >
      Relative Volume at Time — current 1m bar volume / mean SMA(volume, sma_period) at this ET
      bar time over the prior period session days.
    version: '1'
    series_fn: strategies.indicators.rvol_time:rvol_time_series
    inputs:
      trading_date: trading_date
      volume: volume
      timestamp_utc: timestamp
    params:
      period: 10
      sma_period: 20
    outputs:
      - rvol_time
    requires:
      - trading_date
    requires_history_bars: true
    bar_interval_minutes: 1

  - id: adr
    kind: indicator
    description: Average daily range (RTH daily bars) mapped to each minute by trading_date
    version: '1'
    series_fn: strategies.indicators.adr:adr_series
    inputs:
      trading_date: trading_date
    params:
      days: 14
    outputs:
      - adr
    requires:
      - trading_date
    requires_daily_bars: true
    bar_interval_minutes: 1

  - id: atr
    kind: indicator
    description: ATR on RTH daily bars mapped to each minute by trading_date
    version: '1'
    series_fn: strategies.indicators.atr:atr_series
    inputs:
      trading_date: trading_date
    params:
      period: 14
    outputs:
      - atr
    requires:
      - trading_date
    requires_daily_bars: true
    bar_interval_minutes: 1

  - id: bar_range
    kind: indicator
    description: Bar range (high - low) for each bar
    version: '1'
    series_fn: strategies.indicators.bar_range:bar_range_series
    inputs:
      high: high
      low: low
    params: {}
    outputs:
      - bar_range
    requires: []
    bar_interval_minutes: 1

  - id: lod
    kind: indicator
    description: Cumulative RTH low of day through each bar. NaN on PM and AH bars.
    version: '1'
    series_fn: strategies.indicators.lod:lod_series
    inputs:
      low: low
      session: session
      trading_date: trading_date
    params: {}
    outputs:
      - lod
    requires:
      - trading_date
      - session
    bar_interval_minutes: 1

  - id: hod
    kind: indicator
    description: Cumulative RTH high of day through each bar. NaN on PM and AH bars.
    version: '1'
    series_fn: strategies.indicators.hod:hod_series
    inputs:
      high: high
      session: session
      trading_date: trading_date
    params: {}
    outputs:
      - hod
    requires:
      - trading_date
      - session
    bar_interval_minutes: 1

  - id: extension_long
    kind: indicator
    description: Session down-from-open in ATR units. (rth_open - lod) / atr. NaN on PM and AH.
    version: '1'
    series_fn: strategies.indicators.extension:extension_long_series
    inputs:
      open: open
      session: session
      trading_date: trading_date
      lod: lod
      atr: atr
    params: {}
    outputs:
      - extension_long
    requires:
      - trading_date
      - session
      - lod
      - atr
    bar_interval_minutes: 1

  - id: extension_short
    kind: indicator
    description: Session up-from-open in ATR units. (hod - rth_open) / atr. NaN on PM and AH.
    version: '1'
    series_fn: strategies.indicators.extension:extension_short_series
    inputs:
      open: open
      session: session
      trading_date: trading_date
      hod: hod
      atr: atr
    params: {}
    outputs:
      - extension_short
    requires:
      - trading_date
      - session
      - hod
      - atr
    bar_interval_minutes: 1

  - id: rb_reversal_bar
    kind: indicator
    description: >
      True for the 2-min snap bar that qualifies as a rubberband reversal: top-N range in
      inner RTH window, session extension >= atr_extension_min ATR in bar-color direction,
      prior bar break, RVOL >= rvol_min, range > prior bar. At most one bar per session.
    version: '1'
    series_fn: strategies.indicators.rb_reversal_bar:rb_reversal_bar_series
    inputs:
      open: open
      high: high
      low: low
      close: close
      session: session
      trading_date: trading_date
      extension_long: extension_long
      extension_short: extension_short
      rvol: rvol
    params:
      atr_extension_min: 2.0
      rvol_min: 2.0
      top_sized_bar_count: 5
      exclude_edge_bars: 2
    outputs:
      - rb_reversal_bar
    requires:
      - trading_date
      - session
      - extension_long
      - extension_short
      - rvol
    bar_interval_minutes: 2
